events {
    worker_connections 1024;
}

http {
    # 3. Rate Limiting Zone: 10 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream auth_service {
        server auth-service:8000;
    }

    upstream storage_service {
        server storage-service:8000;
    }

    server {
        # 1. SSL Certificates placeholder (Future Development)
        # To enable SSL, uncomment the listen 443 line and the ssl_certificate lines,
        # and comment out listen 80.
        listen 80;
        # listen 443 ssl;
        # ssl_certificate /etc/nginx/ssl/server.crt;
        # ssl_certificate_key /etc/nginx/ssl/server.key;

        # 4. CORS Setup
        # Note: If enabling CORS here, you should disable CORSMiddleware in your FastAPI apps
        # to avoid double headers being sent to the browser.
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

        # Pre-flight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Apply rate limiting to all requests
        limit_req zone=api_limit burst=20 nodelay;
        
        # Block external access to internal endpoints
        location ~ ^/api/v[0-9]+/internal/ {
            deny all;
            return 403;
        }

        # Block direct access to un-prefixed internal endpoints
        location ~ ^/internal/ {
            deny all;
            return 403;
        }

        # Route to Auth Service
        location ~ ^/api/v[0-9]+/auth/ {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # 2. Add X-Forwarded-Proto
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route to Storage Service
        location ~ ^/api/v[0-9]+/(files|folders|share|trash|storage)/ {
            proxy_pass http://storage_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # 2. Add X-Forwarded-Proto
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Allow large file uploads
            client_max_body_size 5G; 
            
            # 5. Timeouts for large files (5 minutes)
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
}
