events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # 1. Connection pooling to backend containers
    upstream auth_service {
        server auth-service:8000;
        keepalive 32;
    }

    upstream storage_service {
        server storage-service:8000;
        keepalive 32;
    }

    # 2. Rate Limiting Setup
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    # 3. Default Proxy Headers & HTTP/1.1 Persistence
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;
        server_name _;

        # Block internal endpoints strictly, regardless of slash
        location ~* ^/api/v[0-9]+/internal(/.*)?$ {
            deny all;
            return 403;
        }

        # Route to Auth Service
        location ~* ^/api/v[0-9]+/auth(/.*)?$ {
            limit_req zone=api_limit burst=20 nodelay;

            # Handle CORS pre-flight within the routed context
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

            client_max_body_size 1M;
            proxy_pass http://auth_service;
        }

        # Route to Storage Service
        location ~* ^/api/v[0-9]+/(files|folders|share|trash|storage)(/.*)?$ {
            limit_req zone=api_limit burst=20 nodelay;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

            # Direct stream configuration for large uploads
            client_max_body_size 5G;
            proxy_request_buffering off;
            proxy_buffering off;

            # File transfer timeouts
            client_body_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_pass http://storage_service;
        }

        # Catch-all fallback for undefined routes
        location / {
            return 404 '{"detail": "Not Found"}';
            add_header Content-Type application/json;
        }
    }
}