name: Duy's Backend CD (Deploy to AWS)

on:
  workflow_dispatch:
  push:
    branches: [dev-duy, aws-deploy, duy-aws-deploy]
    paths:
      - "backend-v2/**"
      - "k8s/**"
      - "terraform/**"
      - "terraform-v2/**"
      - ".github/workflows/duy-backend-cd.yml"

permissions:
  id-token: write # Required for OIDC
  contents: read

env:
  AWS_REGION: ap-southeast-1
  EKS_CLUSTER_NAME: nephos-dev-cluster
  AUTH_SERVICE_ECR: nephos-dev-auth-service
  STORAGE_SERVICE_ECR: nephos-dev-storage-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ secrets.DUY_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: Build, tag, and push Docker image for Auth Service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          cd backend-v2/auth-service
          docker build -t $ECR_REGISTRY/${{ env.AUTH_SERVICE_ECR }}:latest .
          docker push $ECR_REGISTRY/${{ env.AUTH_SERVICE_ECR }}:latest

      - name: Build, tag, and push Docker image for Storage Service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          cd backend-v2/storage-service
          docker build -t $ECR_REGISTRY/${{ env.STORAGE_SERVICE_ECR }}:latest .
          docker push $ECR_REGISTRY/${{ env.STORAGE_SERVICE_ECR }}:latest

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy to Kubernetes and Update CloudFront Origin
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e

          # 1. Fetch CloudFront Domain Name and Distribution ID robustly
          BUCKET_NAME="nephos-dev-frontend-bucket"

          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Origins.Items[0].DomainName, '${BUCKET_NAME}')].Id | [0]" \
            --output text)

          if [ -z "$DIST_ID" ] || [ "$DIST_ID" == "None" ]; then
            echo "Error: Could not find CloudFront Distribution ID for bucket: $BUCKET_NAME"
            exit 1
          fi

          CLOUDFRONT_DOMAIN=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Id=='${DIST_ID}'].DomainName | [0]" \
            --output text)

          echo "Found Distribution ID: $DIST_ID"
          echo "Found CloudFront Domain: $CLOUDFRONT_DOMAIN"

          # 2. Apply base Kubernetes resources
          kubectl apply -f k8s/namespace.yaml

          sed -i "s#CORS_ORIGINS:.*#CORS_ORIGINS: \"https://${CLOUDFRONT_DOMAIN}\"#" k8s/configmap.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/aws-secrets-provider.yaml
          kubectl apply -f k8s/redis.yaml
          kubectl apply -f k8s/rabbitmq.yaml
          kubectl apply -f k8s/ingress.yaml

          # 3. Wait for AWS Load Balancer Controller to assign the ALB hostname
          echo "Waiting for the api-ingress ALB hostname..."
          ALB_HOSTNAME=""
          for attempt in $(seq 1 30); do
            ALB_HOSTNAME=$(kubectl get ingress api-ingress -n nephos \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$ALB_HOSTNAME" ]; then
              echo "Discovered ALB Hostname: $ALB_HOSTNAME"
              break
            fi
            echo "Waiting for api-ingress ALB hostname (attempt $attempt/30)..."
            sleep 10
          done

          if [ -z "$ALB_HOSTNAME" ]; then
            echo "Error: Timed out waiting for ALB hostname to be provisioned."
            echo "--- Ingress Status ---"
            kubectl describe ingress api-ingress -n nephos
            exit 1
          fi

          # 4. Patch CloudFront distribution origin with the new ALB hostname
          aws cloudfront get-distribution-config --id "$DIST_ID" > dist-config.json
          ETAG=$(jq -r '.ETag' dist-config.json)

          ALB_ORIGIN_ID="ALB-api"
          CURRENT_ALB_DOMAIN=$(jq -r --arg id "$ALB_ORIGIN_ID" '.DistributionConfig.Origins.Items[] | select(.Id==$id) | .DomainName' dist-config.json)

          if [ "$CURRENT_ALB_DOMAIN" != "$ALB_HOSTNAME" ]; then
            echo "Updating CloudFront ALB Origin from '$CURRENT_ALB_DOMAIN' to '$ALB_HOSTNAME'..."

            jq --arg alb "$ALB_HOSTNAME" --arg id "$ALB_ORIGIN_ID" \
              '.DistributionConfig.Origins.Items |= map(if .Id == $id then .DomainName = $alb else . end) | .DistributionConfig' \
              dist-config.json > updated-config.json

            aws cloudfront update-distribution \
              --id "$DIST_ID" \
              --if-match "$ETAG" \
              --distribution-config file://updated-config.json
          else
            echo "CloudFront ALB Origin is already set to $ALB_HOSTNAME. Skipping update."
          fi

          # 5. Apply microservice deployments with the actual ECR registry
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          sed -i "s/\${AWS_ACCOUNT_ID}.dkr.ecr.ap-southeast-1.amazonaws.com/${ECR_REGISTRY}/g" k8s/auth-service.yaml
          sed -i "s/\${AWS_ACCOUNT_ID}.dkr.ecr.ap-southeast-1.amazonaws.com/${ECR_REGISTRY}/g" k8s/storage-service.yaml

          kubectl apply -f k8s/auth-service.yaml
          kubectl apply -f k8s/storage-service.yaml

          # 6. Force rollout to pull latest images and verify completion
          kubectl rollout restart deployment auth-service -n nephos
          kubectl rollout restart deployment storage-service -n nephos
          kubectl rollout status deployment/auth-service -n nephos --timeout=5m
          kubectl rollout status deployment/storage-service -n nephos --timeout=5m