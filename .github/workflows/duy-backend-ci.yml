name: Duy's Backend CI (Build & Test)

on:
  workflow_dispatch:
  pull_request:
    branches: [dev-duy, aws-deploy, duy-aws-deploy]
    paths:
      - "backend-v2/**"
      - "terraform/**"
      - "terraform-v2/**"
      - ".github/workflows/duy-backend-ci.yml"
  push:
    branches: [dev-duy, aws-deploy, duy-aws-deploy]
    paths:
      - "backend-v2/**"
      - "terraform/**"
      - "terraform-v2/**"
      - ".github/workflows/duy-backend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "backend-v2/**/requirements.txt"

      - name: Install Dependencies for Auth Service
        run: |
          echo "Installing Python dependencies..."
          cd backend-v2/auth-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests for Auth Service
        run: |
          echo "Running pytest for FastAPI..."
          # cd backend-v2/auth-service
          # python -m pytest -v

      - name: Install Dependencies for Storage Service
        run: |
          echo "Installing Python dependencies..."
          cd backend-v2/storage-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests for Storage Service
        run: |
          echo "Running pytest for FastAPI..."
          # cd backend-v2/storage-service
          # python -m pytest -v

      - name: Test Build Auth Service
        run: |
          cd backend-v2/auth-service
          docker build -t auth-service-test .

      - name: Test Build Storage Service
        run: |
          cd backend-v2/storage-service
          docker build -t storage-service-test .

      - name: Test Build API Gateway
        run: |
          cd backend-v2/api-gateway
          docker build -t api-gateway-test .
