name: Frontend CI/CD Pipeline

on:
  push:
    branches: [main, dev, aws-deploy]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, dev, aws-deploy]
    paths:
      - "frontend/**"

permissions:
  id-token: write # Required for OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: nephos-dev-frontend-bucket

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Angular App
        working-directory: ./frontend
        run: npm run build -- --configuration production

      - name: Configure AWS Credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        if: github.ref == 'refs/heads/main'
        run: |
          aws s3 sync ./frontend/dist/frontend/browser s3://${{ env.S3_BUCKET }}/ --delete

      # To fully automate, we would retrieve the CloudFront Distribution ID using AWS CLI
      # and issue an invalidation.
      - name: Invalidate CloudFront Cache
        if: github.ref == 'refs/heads/main'
        run: |
          CLOUDFRONT_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Aliases.Items==null && Origins.Items[0].DomainName=='${{ env.S3_BUCKET }}.s3.${{ env.AWS_REGION }}.amazonaws.com'].Id" --output text | head -n 1)
          if [ -n "$CLOUDFRONT_ID" ] && [ "$CLOUDFRONT_ID" != "None" ]; then
            aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_ID --paths "/*"
          else
            echo "Could not find CloudFront Distribution for bucket ${{ env.S3_BUCKET }}. Skipping invalidation."
          fi
