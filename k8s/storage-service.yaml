apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-service
  namespace: nephos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storage-service
  template:
    metadata:
      labels:
        app: storage-service
    spec:
      containers:
      - name: storage-service
        image: YOUR_AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/nephos-dev-storage-service:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: nephos-config
        - secretRef:
            name: nephos-app-secrets
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: nephos-app-secrets
              key: DATABASE_URL
              optional: true
        volumeMounts:
        - name: secrets-store-inline
          mountPath: "/mnt/secrets-store"
          readOnly: true
      volumes:
      - name: secrets-store-inline
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "aws-secrets"
---
apiVersion: v1
kind: Service
metadata:
  name: storage-service
  namespace: nephos
spec:
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: storage-service
