<div class="dashboard-wrapper">
  <app-dashboard-header></app-dashboard-header>

  <div class="workspace-container">
    <app-side-panel
      [activeNav]="currentNav()"
      (navChange)="switchNav($any($event))"
      (upload)="onUploadTrigger()"
      (collapsedChange)="onSidebarCollapseChange($event)"
    ></app-side-panel>

    <main class="main-canvas" [class.sidebar-collapsed]="isSidebarCollapsed()">
      <section class="content-section">
        <header class="section-header">
          <app-breadcrumb
            [breadcrumbs]="breadcrumbs()"
            [section]="currentSection() === 'shared-with-me' ? 'shared-with-me' : 'drive'"
            [title]="pageTitle()"
            [description]="currentSection() === 'shared-with-me' ? 'Files and folders shared with you.' : 'Access your stored files and folders.'">
          </app-breadcrumb>
        </header>

        @if (isLoading()) {
        <div class="loading-state">
          <mat-progress-bar mode="indeterminate"></mat-progress-bar>
          <p class="loading-label">Retrieving contents</p>
        </div>
        } @else if (items().length === 0) {
        <div class="empty-state">
          <mat-icon class="empty-icon">folder_open</mat-icon>
          <p class="empty-label">This folder is empty.</p>
          @if (canWrite()) {
          <button mat-stroked-button color="primary" (click)="onUploadTrigger()">
            <mat-icon>upload</mat-icon> Upload files or create a folder
          </button>
          }
        </div>
        } @else {
        <div class="cards-grid">
          @for (item of items(); track item.id) {
          <app-drive-item-card
            [item]="item"
            (open)="onOpenItem($event)"
            (download)="onDownloadItem($event)"
            (share)="onShareItem($event)"
            (trash)="onTrashItem($event)"
          ></app-drive-item-card>
          }
        </div>
        }
      </section>
    </main>
  </div>

  <app-mobile-bottom-nav
    [currentNav]="currentNav()"
    (navChange)="switchNav($any($event))"
    (upload)="onUploadTrigger()"
  ></app-mobile-bottom-nav>

  <app-upload-widget></app-upload-widget>
</div>
