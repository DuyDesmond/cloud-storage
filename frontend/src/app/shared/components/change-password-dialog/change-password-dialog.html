<h2 mat-dialog-title>Change Password</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="change-password-form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Current Password</mat-label>
      <input
        matInput
        [type]="hideCurrentPassword() ? 'password' : 'text'"
        formControlName="currentPassword"
        autofocus
      />
      <button
        mat-icon-button
        matSuffix
        (click)="hideCurrentPassword.set(!hideCurrentPassword())"
        type="button"
      >
        <mat-icon
          >{{ hideCurrentPassword() ? 'visibility_off' : 'visibility'
          }}</mat-icon
        >
      </button>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>New Password</mat-label>
      <input
        matInput
        [type]="hideNewPassword() ? 'password' : 'text'"
        formControlName="newPassword"
      />
      <button
        mat-icon-button
        matSuffix
        (click)="hideNewPassword.set(!hideNewPassword())"
        type="button"
      >
        <mat-icon
          >{{ hideNewPassword() ? 'visibility_off' : 'visibility' }}</mat-icon
        >
      </button>
      @if (form.controls.newPassword.hasError('minlength')) {
      <mat-error>Password must be at least 8 characters</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()" type="button">Cancel</button>
  <button
    mat-flat-button
    color="primary"
    [disabled]="!form.valid"
    (click)="submit()"
    type="submit"
  >
    Change Password
  </button>
</mat-dialog-actions>
