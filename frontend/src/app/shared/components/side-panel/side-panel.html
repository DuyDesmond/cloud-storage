<!-- Added: Mobile backdrop overlay for dimming effect -->
<div
  class="backdrop"
  [class.visible]="!isCollapsed()"
  (click)="toggleCollapse()"
  aria-hidden="true"
></div>

<aside class="side-panel" [class.collapsed]="isCollapsed()">
  <!-- Added: Collapse/Expand toggle button -->
  <div class="collapse-toggle-container">
    <button
      type="button"
      class="toggle-btn"
      (click)="toggleCollapse()"
      [attr.aria-label]="isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    >
      <mat-icon
        >{{ isCollapsed() ? 'chevron_right' : 'chevron_left' }}</mat-icon
      >
    </button>
  </div>

  <div class="storage-summary">
    <h2>Cloud Storage</h2>
    <p class="storage-text">
      <span class="bold">{{ usedStorage() }} GB</span> of {{ totalStorage() }}
      GB used
    </p>
    <mat-progress-bar
      mode="determinate"
      [value]="storagePercentage()"
    ></mat-progress-bar>
  </div>

  <nav class="nav-links">
    @for (item of navItems; track item.key){
    <button
      [class.active]="activeNav() === item.key"
      (click)="onNavClick(item)"
      class="nav-item"
    >
      <mat-icon>{{ item.icon }}</mat-icon>
      <span>{{ item.label }}</span>
    </button>
    }
  </nav>

  <div class="sidebar-action">
    <button
      mat-stroked-button
      color="primary"
      class="upgrade-btn"
      (click)="upgrade.emit()"
    >
      <!-- Added: Icon for collapsed state -->
      <mat-icon class="action-icon">upload</mat-icon>
      <span class="action-label">Upgrade Storage</span>
    </button>
  </div>
</aside>
