<div
  class="backdrop"
  [class.visible]="!isCollapsed()"
  (click)="toggleCollapse()"
  aria-hidden="true"
></div>

<aside class="side-panel" [class.collapsed]="isCollapsed()">
  <div class="collapse-toggle-container">
    <button
      type="button"
      class="toggle-btn"
      (click)="toggleCollapse()"
      [attr.aria-label]="isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    >
      <mat-icon>
        {{ isCollapsed() ? 'chevron_right' : 'chevron_left' }}
      </mat-icon>
    </button>
  </div>

  <div class="primary-upload-action">
    <button
      mat-flat-button
      color="primary"
      class="upload-btn"
      (click)="upload.emit()"
      [attr.aria-label]="'Upload File'"
    >
      <mat-icon>add</mat-icon>
      <span class="action-label">New Upload</span>
    </button>
  </div>

  @if (!storageState.isLoading()) {
  <div class="storage-summary">
    <h2>Cloud Storage</h2>
    <p class="storage-text">
      <span class="bold">{{ storageState.usedStorageGB().toFixed(2) }} GB</span>
      of {{ storageState.totalStorageGB().toFixed(2) }} GB used
    </p>
    <mat-progress-bar
      mode="determinate"
      [value]="storageState.storagePercentage()"
    ></mat-progress-bar>
  </div>
  }

  <nav class="nav-links">
    @for (item of navItems; track item.key) {
    <button
      [class.active]="activeNav() === item.key"
      (click)="onNavClick(item)"
      class="nav-item"
      [title]="isCollapsed() ? item.label : ''"
    >
      <mat-icon>{{ item.icon }}</mat-icon>
      <span class="nav-label">{{ item.label }}</span>
    </button>
    }
  </nav>

  <div class="sidebar-action">
    <button
      mat-stroked-button
      color="primary"
      class="upgrade-btn"
      (click)="upgrade.emit()"
    >
      <mat-icon class="action-icon">arrow_upward</mat-icon>
      <span class="action-label">Upgrade Storage</span>
    </button>
  </div>
</aside>
